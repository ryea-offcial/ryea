<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RYEA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Auth Container (Login Form) -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-200">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-teal-800">RYEA Admin Login</h1>
                <p class="text-sm text-gray-500 mt-1">Please login to access control panel</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-teal-800 text-white font-bold py-2.5 rounded-lg hover:bg-teal-900 transition">Login</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-container" class="hidden">
        <!-- Top Navbar -->
        <header class="bg-teal-900 text-white shadow-sm sticky top-0 z-40">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="bg-amber-400 text-gray-900 text-xs font-bold px-2.5 py-1 rounded">ADMIN PANEL</span>
                    <h1 class="text-xl font-extrabold tracking-wide">RYEA Control Panel</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-amber-300 hidden md:inline"></span>
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="bg-white border-b sticky top-[68px] z-30 shadow-sm">
            <div class="container mx-auto px-4 flex space-x-4 overflow-x-auto">
                <button onclick="switchTab('activities')" id="tab-btn-activities" class="tab-btn border-b-2 border-teal-800 text-teal-800 font-bold py-3 px-4 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper"></i> Recent Activities & Work
                </button>
                <button onclick="switchTab('leadership')" id="tab-btn-leadership" class="tab-btn border-b-2 border-transparent text-gray-600 hover:text-teal-800 font-bold py-3 px-4 flex items-center gap-2">
                    <i class="fa-solid fa-users"></i> Leadership Team
                </button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <main class="container mx-auto px-4 py-8">

            <!-- 1. RECENT ACTIVITIES TAB CONTENT -->
            <div id="tab-activities" class="tab-content grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 sticky top-36">
                        <h2 id="activity-form-title" class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center">
                            <i class="fa-solid fa-plus-circle text-teal-700 mr-2"></i> Add Activity
                        </h2>
                        <form id="activity-form" class="space-y-4">
                            <input type="hidden" id="activity-edit-id">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Activity Title *</label>
                                <input type="text" id="activity-title" placeholder="যেমন: শীতবস্ত্র বিতরণ কার্যক্রম" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Activity Photo *</label>
                                <input type="file" id="activity-image-file" accept="image/*" class="w-full text-xs text-gray-500 border rounded-lg p-1">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Date *</label>
                                <input type="date" id="activity-date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Details/Description *</label>
                                <textarea id="activity-desc" rows="3" placeholder="সংক্ষেপে কার্যক্রমের বিবরণ লিখুন..." required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none"></textarea>
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" id="activity-submit-btn" class="w-full bg-teal-800 hover:bg-teal-900 text-white font-bold py-2 rounded-lg shadow-sm transition">Save Activity</button>
                                <button type="button" onclick="resetActivityForm()" id="activity-cancel-btn" class="hidden w-1/3 bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Recent Activities List</h2>
                        <div id="activities-list" class="space-y-4"></div>
                    </div>
                </div>
            </div>

            <!-- 2. LEADERSHIP TAB CONTENT -->
            <div id="tab-leadership" class="tab-content hidden grid lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 sticky top-36">
                        <h2 id="leader-form-title" class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center">
                            <i class="fa-solid fa-plus-circle text-teal-700 mr-2"></i> Add Leader
                        </h2>
                        <form id="leader-form" class="space-y-4">
                            <input type="hidden" id="leader-edit-id">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Full Name *</label>
                                <input type="text" id="leader-name" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Designation/Role *</label>
                                <input type="text" id="leader-role" placeholder="e.g. Founder & CEO" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Email *</label>
                                <input type="email" id="leader-email" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Photo (Optional)</label>
                                <input type="file" id="leader-image-file" accept="image/*" class="w-full text-xs text-gray-500 border rounded-lg p-1">
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" id="leader-submit-btn" class="w-full bg-teal-800 hover:bg-teal-900 text-white font-bold py-2 rounded-lg shadow-sm transition">Save Leader</button>
                                <button type="button" onclick="resetLeaderForm()" id="leader-cancel-btn" class="hidden w-1/3 bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Leadership Team List</h2>
                        <div id="leadership-list" class="space-y-4"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase v10 Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase Configuration (Connected to your ryea-6a3ef project)
        const firebaseConfig = {
            apiKey: "AIzaSyDJL8W3-yifNW_nD8hbDnYms7mLWTx10Ic",
            authDomain: "ryea-6a3ef.firebaseapp.com",
            projectId: "ryea-6a3ef",
            storageBucket: "ryea-6a3ef.firebasestorage.app",
            messagingSenderId: "967055218910",
            appId: "1:967055218910:web:cfda3fc1d92a18ee2d4a4f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI Tabs Switcher
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-teal-800', 'text-teal-800');
                el.classList.add('border-transparent', 'text-gray-600');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.classList.add('border-teal-800', 'text-teal-800');
            activeBtn.classList.remove('border-transparent', 'text-gray-600');
        };

        // Authentication State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                document.getElementById('user-email-display').textContent = user.email;
                loadActivities();
                loadLeadership();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard-container').classList.add('hidden');
            }
        });

        // Login / Logout
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                document.getElementById('login-error').textContent = err.message;
                document.getElementById('login-error').classList.remove('hidden');
            }
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Helper Image Upload Function
        async function uploadImage(file, folderName) {
            const storageRef = ref(storage, `${folderName}/${Date.now()}_${file.name}`);
            const uploadTask = await uploadBytes(storageRef, file);
            const downloadUrl = await getDownloadURL(uploadTask.ref);
            return { url: downloadUrl, path: uploadTask.ref.fullPath };
        }

        // ================= 1. ACTIVITIES CRUD =================
        const activityForm = document.getElementById('activity-form');
        activityForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('activity-edit-id').value;
            const submitBtn = document.getElementById('activity-submit-btn');
            const file = document.getElementById('activity-image-file').files[0];
            
            submitBtn.disabled = true; 
            submitBtn.innerText = "Saving...";

            try {
                let data = {
                    title: document.getElementById('activity-title').value,
                    date: document.getElementById('activity-date').value,
                    description: document.getElementById('activity-desc').value,
                };

                if (file) {
                    const imgData = await uploadImage(file, "activities");
                    data.image = imgData.url;
                    data.imagePath = imgData.path;
                }

                if (editId) {
                    await updateDoc(doc(db, "activities", editId), data);
                } else {
                    if (!file) throw new Error("Please select an activity photo!");
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "activities"), data);
                }
                resetActivityForm();
            } catch (err) { 
                alert(err.message); 
            } finally { 
                submitBtn.disabled = false; 
                submitBtn.innerText = "Save Activity"; 
            }
        });

        function loadActivities() {
            const q = query(collection(db, "activities"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('activities-list');
                list.innerHTML = '';
                
                if (snapshot.docs.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-4">No activities added yet.</p>';
                    return;
                }

                snapshot.docs.forEach(docSnap => {
                    const d = docSnap.data(); 
                    const id = docSnap.id;
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-gray-50 border rounded-lg">
                            <div class="flex items-center space-x-3">
                                <img src="${d.image}" class="w-16 h-12 object-cover rounded bg-gray-200">
                                <div>
                                    <h4 class="font-bold text-sm">${d.title}</h4>
                                    <span class="text-xs text-amber-600 font-semibold">${d.date}</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editActivity('${id}', '${d.title}', '${d.date}', '${d.description.replace(/'/g, "\\'")}')" class="text-blue-600 font-bold text-xs">Edit</button>
                                <button onclick="deleteDocItem('activities', '${id}', '${d.imagePath||''}')" class="text-red-600 font-bold text-xs">Delete</button>
                            </div>
                        </div>`;
                });
            });
        }

        window.editActivity = (id, title, date, desc) => {
            document.getElementById('activity-edit-id').value = id;
            document.getElementById('activity-title').value = title;
            document.getElementById('activity-date').value = date;
            document.getElementById('activity-desc').value = desc;
            document.getElementById('activity-form-title').innerText = "Edit Activity";
            document.getElementById('activity-cancel-btn').classList.remove('hidden');
        };

        window.resetActivityForm = () => {
            activityForm.reset();
            document.getElementById('activity-edit-id').value = '';
            document.getElementById('activity-form-title').innerText = "Add Activity";
            document.getElementById('activity-cancel-btn').classList.add('hidden');
        };

        // ================= 2. LEADERSHIP CRUD =================
        const leaderForm = document.getElementById('leader-form');
        leaderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('leader-edit-id').value;
            const submitBtn = document.getElementById('leader-submit-btn');
            const file = document.getElementById('leader-image-file').files[0];
            
            submitBtn.disabled = true; 
            submitBtn.innerText = "Saving...";

            try {
                let data = {
                    name: document.getElementById('leader-name').value,
                    role: document.getElementById('leader-role').value,
                    email: document.getElementById('leader-email').value,
                };

                if (file) {
                    const imgData = await uploadImage(file, "leaders");
                    data.image = imgData.url;
                    data.imagePath = imgData.path;
                }

                if (editId) {
                    await updateDoc(doc(db, "leaders", editId), data);
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "leaders"), data);
                }
                resetLeaderForm();
            } catch (err) { 
                alert(err.message); 
            } finally { 
                submitBtn.disabled = false; 
                submitBtn.innerText = "Save Leader"; 
            }
        });

        function loadLeadership() {
            const q = query(collection(db, "leaders"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('leadership-list');
                list.innerHTML = '';

                if (snapshot.docs.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-4">No team members added yet.</p>';
                    return;
                }

                snapshot.docs.forEach(docSnap => {
                    const d = docSnap.data(); 
                    const id = docSnap.id;
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-gray-50 border rounded-lg">
                            <div class="flex items-center space-x-3">
                                <img src="${d.image || 'https://via.placeholder.com/100'}" class="w-12 h-12 rounded-full object-cover bg-gray-200">
                                <div>
                                    <h4 class="font-bold text-sm">${d.name}</h4>
                                    <p class="text-xs text-teal-700 font-semibold">${d.role}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editLeader('${id}', '${d.name}', '${d.role}', '${d.email}')" class="text-blue-600 font-bold text-xs">Edit</button>
                                <button onclick="deleteDocItem('leaders', '${id}', '${d.imagePath||''}')" class="text-red-600 font-bold text-xs">Delete</button>
                            </div>
                        </div>`;
                });
            });
        }

        window.editLeader = (id, name, role, email) => {
            document.getElementById('leader-edit-id').value = id;
            document.getElementById('leader-name').value = name;
            document.getElementById('leader-role').value = role;
            document.getElementById('leader-email').value = email;
            document.getElementById('leader-form-title').innerText = "Edit Leader";
            document.getElementById('leader-cancel-btn').classList.remove('hidden');
        };

        window.resetLeaderForm = () => {
            leaderForm.reset();
            document.getElementById('leader-edit-id').value = '';
            document.getElementById('leader-form-title').innerText = "Add Leader";
            document.getElementById('leader-cancel-btn').classList.add('hidden');
        };

        // Shared Global Delete Function
        window.deleteDocItem = async (collectionName, id, imagePath) => {
            if (confirm("Are you sure you want to delete this item?")) {
                try {
                    await deleteDoc(doc(db, collectionName, id));
                    if (imagePath) {
                        await deleteObject(ref(storage, imagePath)).catch(err => console.log("Storage delete note: ", err));
                    }
                } catch (err) { 
                    alert("Error deleting: " + err.message); 
                }
            }
        };
    </script>
</body>
</html>
