
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rohingya Hope Initiative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Auth Container (Login Form) -->
    <div id="auth-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-emerald-700">অ্যাডমিন লগইন</h1>
                <p class="text-sm text-gray-500 mt-1">প্যানেলে প্রবেশ করতে আপনার ইমেইল ও পাসওয়ার্ড দিন</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700 transition">লগইন করুন</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-container" class="hidden">
        <!-- Top Navbar -->
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded">Admin</span>
                    <h1 class="text-xl font-bold text-gray-800">Rohingya Hope Control Panel</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-600 hidden md:inline"></span>
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> লগআউট
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="container mx-auto px-4 py-8 grid lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Add New Project Form -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 sticky top-24">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center">
                        <i class="fa-solid fa-plus-circle text-emerald-600 mr-2"></i> নতুন প্রজেক্ট যুক্ত করুন
                    </h2>
                    <form id="add-project-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">প্রজেক্টের নাম (Title)</label>
                            <input type="text" id="project-title" placeholder="যেমন: শীতবস্ত্র বিতরণ" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        
                        <!-- Image Upload Field -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ছবি আপলোড করুন (Image File)</label>
                            <input type="file" id="project-image-file" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border rounded-lg cursor-pointer">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">প্রজেক্টের বর্ণনা (Description)</label>
                            <textarea id="project-desc" rows="4" placeholder="সংক্ষেপে প্রজেক্টের উদ্দেশ্য লিখুন..." required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ডোনেট লিঙ্ক (Donate Link - ঐচ্ছিক)</label>
                            <input type="text" id="project-donate" placeholder="#donate বা কাস্টম পেমেন্ট লিংক" value="#donate" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow-sm transition">
                            পাবলিশ করুন
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Live Projects List -->
            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <div class="flex justify-between items-center mb-6 pb-2 border-b">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center">
                            <i class="fa-solid fa-list-check text-emerald-600 mr-2"></i> বর্তমান প্রজেক্টসমূহ
                        </h2>
                        <span id="project-count" class="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full font-bold">মোট: ০</span>
                    </div>

                    <!-- Loader -->
                    <div id="loading-spinner" class="text-center py-12">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600"></i>
                        <p class="text-sm text-gray-500 mt-2">ডাটা লোড হচ্ছে...</p>
                    </div>

                    <!-- Projects Grid/List -->
                    <div id="admin-projects-list" class="space-y-4"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Script (v10 Modular Web SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            serverTimestamp, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getStorage, 
            ref, 
            uploadBytes, 
            getDownloadURL, 
            deleteObject 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ==========================================
        // 1. আপনার Firebase কনফিগারেশন এখানে বসান
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        const addProjectForm = document.getElementById('add-project-form');
        const projectsList = document.getElementById('admin-projects-list');
        const loadingSpinner = document.getElementById('loading-spinner');
        const projectCount = document.getElementById('project-count');

        // ==========================================
        // 2. Authentication Handling
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                loadProjects();
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });

        // Login Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            loginError.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে!";
                loginError.classList.remove('hidden');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => signOut(auth));

        // ==========================================
        // 3. Add New Project with Image File Upload
        // ==========================================
        addProjectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const fileInput = document.getElementById('project-image-file');
            const file = fileInput.files[0];

            if (!file) {
                alert("অনুগ্রহ করে একটি ছবি নির্বাচন করুন!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ছবি আপলোড হচ্ছে...';

            try {
                // Upload Image to Firebase Storage
                const storageRef = ref(storage, `projects/${Date.now()}_${file.name}`);
                const uploadTask = await uploadBytes(storageRef, file);
                const imageUrl = await getDownloadURL(uploadTask.ref);

                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ডাটা সেভ হচ্ছে...';

                // Save Document to Firestore
                await addDoc(collection(db, "projects"), {
                    title: document.getElementById('project-title').value,
                    image: imageUrl,
                    imagePath: uploadTask.ref.fullPath, // For deleting image later
                    description: document.getElementById('project-desc').value,
                    donateLink: document.getElementById('project-donate').value || "#donate",
                    createdAt: serverTimestamp()
                });

                addProjectForm.reset();
                alert("প্রজেক্ট সফলভাবে আপলোড করা হয়েছে!");
            } catch (error) {
                alert("ত্রুটি: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'পাবলিশ করুন';
            }
        });

        // ==========================================
        // 4. Real-time Fetch & Delete Projects
        // ==========================================
        function loadProjects() {
            const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                loadingSpinner.classList.add('hidden');
                projectsList.innerHTML = '';
                projectCount.textContent = `মোট: ${snapshot.docs.length}`;

                if(snapshot.docs.length === 0) {
                    projectsList.innerHTML = `<p class="text-center text-gray-500 py-6">কোনো প্রজেক্ট পাওয়া যায়নি।</p>`;
                    return;
                }

                snapshot.docs.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "flex flex-col sm:flex-row items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200 gap-4";
                    card.innerHTML = `
                        <div class="flex items-center space-x-4 w-full sm:w-auto">
                            <img src="${data.image}" alt="Thumb" class="w-20 h-16 object-cover rounded-md flex-shrink-0 bg-gray-200" onerror="this.src='https://via.placeholder.com/80x60'">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm md:text-base">${data.title}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 mt-1">${data.description}</p>
                            </div>
                        </div>
                        <button onclick="deleteProject('${id}', '${data.imagePath || ''}')" class="w-full sm:w-auto bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>ডিলিট</span>
                        </button>
                    `;
                    projectsList.appendChild(card);
                });
            });
        }

        // Global Delete Function (Deletes Firestore Document & Storage Image)
        window.deleteProject = async (id, imagePath) => {
            if(confirm("আপনি কি নিশ্চিত যে এই প্রজেক্টটি ডিলিট করতে চান?")) {
                try {
                    // Delete Document
                    await deleteDoc(doc(db, "projects", id));
                    
                    // Delete Storage Image if path exists
                    if (imagePath) {
                        const imageRef = ref(storage, imagePath);
                        await deleteObject(imageRef).catch(err => console.log("Storage image deletion skipped: ", err));
                    }
                } catch (error) {
                    alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
